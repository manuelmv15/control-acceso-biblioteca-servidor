# Producción — archivo standalone, NO es un override (no se combina con -f
# junto a docker-compose.yml; ese es el de desarrollo, ver ese archivo).
#
# No expone el puerto de MySQL al host: `servidor` llega a `db` por la red
# interna de Compose (DB_HOST=db), así que no hay necesidad funcional de
# publicarlo, y hacerlo amplía la superficie de ataque innecesariamente
# (H-007, docs/security-testing-log.md).
#
# Tampoco monta el código como volumen ni corre con --reload: la imagen se
# construye con el código ya copiado dentro (servidor/Dockerfile) y uvicorn
# corre sin --reload, como en cualquier build de producción.
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: America/El_Salvador
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  servidor:
    build: ./servidor
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS_HASH: ${ADMIN_PASS_HASH}
      KIOSK_API_KEY: ${KIOSK_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOGIN_MAX_INTENTOS: ${LOGIN_MAX_INTENTOS}
      LOGIN_BLOQUEO_MINUTOS: ${LOGIN_BLOQUEO_MINUTOS}
      MAX_BODY_SIZE_BYTES: ${MAX_BODY_SIZE_BYTES}
      SYNC_MAX_SESIONES: ${SYNC_MAX_SESIONES}
      TZ: America/El_Salvador

volumes:
  db_data:
