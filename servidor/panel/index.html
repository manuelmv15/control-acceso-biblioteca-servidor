<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca UES — Panel Administrativo</title>
    <link rel="stylesheet" href="/panel/style.css?v=4">
</head>
<body>

    <div id="login-screen" class="screen">
        <div class="login-box">
            <div class="login-escudo">UES</div>
            <h1>Biblioteca Universitaria</h1>
            <h2>Panel Administrativo</h2>
            <input type="text" id="username" placeholder="Usuario" value="admin">
            <input type="password" id="password" placeholder="Contraseña">
            <button id="btn-login">Ingresar</button>
            <p id="login-error" class="error"></p>
        </div>
    </div>

    <div id="panel-screen" class="screen hidden">
        <header>
            <div class="header-brand">
                <span class="header-escudo">UES</span>
                <h1>Biblioteca — Control de Acceso</h1>
            </div>
            <div class="header-right">
                <span id="pcs-activas-badge">● 0 PCs activas</span>
                <span id="last-update"></span>
                <button id="btn-logout" class="btn-secondary">Cerrar sesión</button>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="sesiones">Sesiones</button>
            <button class="tab" data-tab="pcs">PCs</button>
            <button class="tab" data-tab="estudiantes">Estudiantes</button>
        </nav>

        <div id="tab-container"></div>
    </div>

    <script src="/panel/js/api.js?v=4"></script>
    <script src="/panel/js/sesiones.js?v=4"></script>
    <script src="/panel/js/pcs.js?v=4"></script>
    <script src="/panel/js/estudiantes.js?v=4"></script>
    <script src="/panel/js/app.js?v=4"></script>
</body>
</html>
