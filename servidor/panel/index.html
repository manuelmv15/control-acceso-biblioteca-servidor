<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca UES — Panel Administrativo</title>
    <link rel="icon" type="image/png" href="/panel/img/logo-fmp.png">
    <link rel="stylesheet" href="/panel/style.css?v=15">
</head>
<body>

    <div id="login-screen" class="screen">
        <div class="login-container">
            <div class="logo-section-wrapper">
                <div class="logo-section">
                    <div class="logo-circle">
                        <img src="/panel/img/logo-fmp.png" alt="Universidad de El Salvador — Facultad Multidisciplinaria Paracentral">
                    </div>
                    <h1>Bienvenido</h1>
                    <p>Accede al panel para controlar el acceso a la biblioteca</p>
                </div>
            </div>
            <div class="form-section-wrapper">
                <div class="form-section">
                    <h2>Biblioteca Universitaria</h2>
                    <p class="subtitle">Panel Administrativo</p>
                    <input type="text" id="username" placeholder="Usuario" value="admin">
                    <input type="password" id="password" placeholder="Contraseña">
                    <button id="btn-login">Ingresar</button>
                    <p id="login-error" class="error"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="panel-screen" class="screen hidden">
        <header>
            <div class="header-brand">
                <img class="header-logo" src="/panel/img/logo-fmp.png" alt="UES — FMP">
                <h1>Biblioteca — Control de Acceso</h1>
            </div>
            <div class="header-right">
                <button id="btn-logout" class="btn-secondary btn-logout" aria-label="Cerrar sesión">
                    <span class="logout-icon" aria-hidden="true">⇥</span>
                    <span>Cerrar sesión</span>
                </button>
            </div>
        </header>

        <nav class="tabs" aria-label="Secciones del panel" role="tablist">
            <button class="tab active" data-tab="sesiones" role="tab" aria-selected="true">Sesiones</button>
            <button class="tab" data-tab="pcs" role="tab" aria-selected="false">PCs</button>
            <button class="tab" data-tab="estudiantes" role="tab" aria-selected="false">Estudiantes</button>
            <button class="tab" data-tab="estadisticas" role="tab" aria-selected="false">Estadísticas</button>
        </nav>

        <div id="tab-container"></div>
    </div>

    <script src="/panel/js/api.js?v=8"></script>
    <script src="/panel/js/sesiones.js?v=10"></script>
    <script src="/panel/js/pcs.js?v=10"></script>
    <script src="/panel/js/estudiantes.js?v=9"></script>
    <script src="/panel/js/estadisticas.js?v=8"></script>
    <script src="/panel/js/app.js?v=8"></script>
</body>
</html>
