<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca — Panel Administrativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen" class="screen">
        <div class="login-box">
            <h1>Biblioteca</h1>
            <h2>Panel Administrativo</h2>
            <input type="text" id="username" placeholder="Usuario" value="admin">
            <input type="password" id="password" placeholder="Contraseña">
            <button onclick="login()">Ingresar</button>
            <p id="login-error" class="error"></p>
        </div>
    </div>

    <div id="panel-screen" class="screen hidden">
        <header>
            <h1>Biblioteca — Control de Acceso</h1>
            <div class="header-right">
                <span id="pcs-activas-badge">● 0 PCs activas</span>
                <span id="last-update"></span>
                <button onclick="logout()" class="btn-secondary">Cerrar sesión</button>
            </div>
        </header>

        <div class="resumen-bar" id="resumen-bar"></div>

        <div class="filters">
            <input type="date" id="filter-fecha" onchange="cargarDatos()">
            <select id="filter-carrera" onchange="cargarDatos()">
                <option value="">Todas las carreras</option>
            </select>
            <select id="filter-facultad" onchange="cargarDatos()">
                <option value="">Todas las facultades</option>
            </select>
            <select id="filter-pc" onchange="cargarDatos()">
                <option value="">Todas las PCs</option>
            </select>
            <input type="text" id="filter-carnet" placeholder="Buscar carnet..." oninput="filtrarLocal()">
            <button onclick="exportarCSV()" class="btn-export">Exportar CSV</button>
        </div>

        <div class="table-wrap">
            <table id="tabla-sesiones">
                <thead>
                    <tr>
                        <th>Carnet</th>
                        <th>Nombre</th>
                        <th>Carrera</th>
                        <th>PC</th>
                        <th>Hora inicio</th>
                        <th>Hora fin</th>
                        <th>Duración</th>
                    </tr>
                </thead>
                <tbody id="tabla-body"></tbody>
            </table>
            <p id="no-data" class="hidden">Sin registros para los filtros seleccionados.</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
