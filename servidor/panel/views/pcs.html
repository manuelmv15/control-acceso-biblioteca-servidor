<div class="tab-toolbar">
    <span class="tab-title">Estado de PCs en tiempo real</span>
    <button id="btn-refresh-pcs" class="btn-danger">Actualizar</button>
</div>

<div id="pcs-grid" class="pcs-grid"></div>
<p id="no-pcs" class="empty-msg hidden">No hay PCs registradas aún.</p>

<div class="tab-toolbar">
    <span class="tab-title">Mantenimiento</span>
</div>

<div class="tab-toolbar">
    <span class="tab-title">Nueva PC</span>
    <input type="text" id="nueva-pc-id" placeholder="PC_ID (el que muestra setup.py en la PC nueva)">
    <button id="btn-nueva-pc-apikey" class="btn-secondary">Generar API key</button>
</div>
<div class="table-wrap compact-table-wrap">
    <table class="compact-table maintenance-table">
        <thead>
            <tr>
                <th>PC</th>
                <th>Último mantenimiento</th>
                <th>Uso en sesiones</th>
                <th>Horas encendida (real)</th>
                <th>Estado</th>
                <th>Specs</th>
                <th>API key</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="mantenimiento-body"></tbody>
    </table>
    <p id="no-mantenimiento" class="empty-msg hidden">No hay PCs registradas aún.</p>
</div>
