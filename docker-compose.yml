# Desarrollo — configuración por defecto de `docker compose up`.
#
# Monta ./servidor como volumen y corre uvicorn con --reload, así que los
# cambios en el código se reflejan sin reconstruir la imagen. Publica además
# el puerto 3306 de MySQL al host para poder conectarte directo (MySQL
# Workbench, `mysql` CLI, backups manuales, etc.) durante desarrollo local.
#
# Para producción usa el archivo standalone docker-compose.prod.yml (no se
# combina con este vía -f, es autosuficiente):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# dns_search: [.] en ambos servicios evita que se herede el search domain
# de Tailscale (p. ej. "taile278cb.ts.net") desde /etc/resolv.conf del host.
# Sin esto, el resolver de glibc en el contenedor `servidor` intenta primero
# "db.<search-domain>" contra el DNS de Tailscale antes que el nombre "db"
# simple, y esa consulta externa cuelga/falla, provocando
# "Temporary failure in name resolution" y un crash-loop al conectar a MySQL.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: America/El_Salvador
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    dns_search:
      - .

  servidor:
    build: ./servidor
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS_HASH: ${ADMIN_PASS_HASH}
      KIOSK_API_KEY: ${KIOSK_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOGIN_MAX_INTENTOS: ${LOGIN_MAX_INTENTOS}
      LOGIN_BLOQUEO_MINUTOS: ${LOGIN_BLOQUEO_MINUTOS}
      MAX_BODY_SIZE_BYTES: ${MAX_BODY_SIZE_BYTES}
      SYNC_MAX_SESIONES: ${SYNC_MAX_SESIONES}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS}
      TZ: America/El_Salvador
    volumes:
      - ./servidor:/app
    dns_search:
      - .

volumes:
  db_data:
