services:
  servidor:
    build: ./servidor
    ports:
      - "8000"
    volumes:
      - db_data:/app/data
    environment:
      - DB_PATH=/app/data/biblioteca.db
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASS=${ADMIN_PASS}
      - TZ=America/El_Salvador
    restart: unless-stopped


volumes:
  db_data:
